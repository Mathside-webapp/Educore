<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>EduCore — Temporarily Unavailable</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#172033}body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:28px;padding:34px;box-shadow:0 22px 60px rgba(76,48,31,.12);text-align:center}.icon{width:96px;height:96px;margin:0 auto 18px;border-radius:24px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid #e2e8f0}.icon img{width:86px;height:86px;object-fit:contain}h1{font-size:32px;margin:0 0 10px}p{margin:0 auto;color:#75675d;line-height:1.6;max-width:390px}.hint{font-size:13px;margin-top:10px}.actions{margin-top:24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:13px;background:#4f46e5;color:#fff;font:800 15px system-ui;padding:12px 20px;cursor:pointer}.ghost{background:#fff;color:#172033;border:1px solid #dbe2ea}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon"><img src="assets/educore-logos/educore-general.png?v=305" alt="EduCore"></div>
    <h1>EduCore is temporarily unavailable</h1>
    <p>EduCore could not load the live classroom right now. Check your internet connection or try again shortly.</p>
    <p class="hint">Your classes and submitted work remain stored in EduCore. This page appears only while the live site cannot be reached.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try again</button>
      <button class="ghost" type="button" onclick="history.back()">Go back</button>
    </div>
  </main>
</body>
</html>
